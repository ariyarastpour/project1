{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUp Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      p,
      h1,h2,h3,a,span {
        font-family: 'Playfair Display', serif;
      }
    </style>
</head>
<body class="bg-black p-24">
<div class="w-full flex items-center justify-center p-4">
    <div class="flex flex-col bg-gray-400 px-5 py-7 rounded-lg shadow-xl w-2/5">
        <h2 class="text-6xl font-semibold text-gray-800 mb-8 text-center">SignUp</h2>
    
        <form class="flex flex-col px-7 space-y-2 items-center" method="post" action="{% url 'accounts:signup' %}">
          {% csrf_token %}
            <!-- Username -->
            <div class="w-full">
              <label class="block text-lg font-medium text-gray-700 mb-1">Username</label>
              <input type="text" name="username" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-gray-400 focus:outline-none transition" placeholder="username">
            </div>

            <!-- Password1 -->
            <div class="w-full">
              <label class="block text-lg font-medium text-gray-700 mb-1">Password</label>
              <input type="password" name="password1" class="w-full px-3 py-2 mb-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-gray-400 focus:outline-none transition" placeholder="password">
            </div>

            <!-- Password2 -->
            <div class="w-full">
              <label class="block text-lg font-medium text-gray-700 mb-1">Confirm Password</label>
              <input type="password" name="password2" class="w-full px-3 py-2 mb-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-gray-400 focus:outline-none transition" placeholder="Confirm Password">
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md transition duration-200">
                SignUp
            </button>
        </form>
    </div>
</div>
</body>
</html>
