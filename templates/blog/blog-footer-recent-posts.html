{% load static %}

<div class="flex flex-col gap-5 w-full sm:w-1/2 lg:w-1/5">
   <h2 class="text-white font-semibold md:text-2xl text-xl md:pb-3 pb-2">Recent Posts</h2>
   <div class="flex flex-col md:gap-y-0 gap-x-6 gap-y-1">
       {% for post in recent_posts %}
           <a href="{% url 'blog:pid' post.id %}" class="md:text-lg text-md text-white font-medum hover:text-black transition">{{post.title}}</a>
       {% endfor %}
   </div>
</div>
