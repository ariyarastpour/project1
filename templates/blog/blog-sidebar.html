{% load static %}
{% load blog_tags %}

<div class="flex flex-col md:w-1/4 py-[30px] md:mr-6 md:px-0 px-4 md:gap-10 gap-8">
    <div class="flex items-center justify-center md:py-8 py-6 px-1 bg-white">
       <form method="get" class="relative w-11/12 px-3">
            <input 
                class="bg-[#FAFAFA] py-2 md:px-4 px-3 font-medium text-[#666] text-lg border border-solid border-[#dddddd] rounded-sm w-full" type="text"
                placeholder="Search..." name="s">
            <img class="w-3 h-3 absolute right-6 top-1/2 -translate-y-1/2" src="{% static 'search-icon.webp' %}" alt="search">
       </form>
    </div>
    
    {% recent_posts %}

    {% popular_posts %}
    
    {% posts_categories %}
</div>
