{% load static %}

<div class="flex flex-col md:w-1/4 py-[30px] md:mr-6 md:px-0 px-4 md:gap-10 gap-8">
    <div class="flex items-center justify-center py-8 px-1 bg-white">
       <div class="relative w-11/12 px-3">
            <input 
                class="bg-[#FAFAFA] py-2 px-4 font-medium text-[#666] text-lg border border-solid border-[#dddddd] rounded-sm w-full" type="text"
                placeholder="Search...">
            <img class="w-3 h-3 absolute right-6 top-1/2 -translate-y-1/2" src="{% static 'search-icon.webp' %}" alt="search">
        </div>
    </div>
    <div class="flex flex-col p-9 gap-5 bg-white">
        <h2 class="text-[1.5rem] text-[#3a3a3a] font-semibold">Recent Posts</h2>
       <div class="flex flex-col gap-1">
            {% for post in recent_posts %}
            <a href="{% url 'blog:pid' pid=post.id %}" class="md:text-lg text-md text-[#444444] font-medum hover:text-black transition">{{post.title}}</a>
            {% endfor %}
        </div>
    </div>
    <div class="flex flex-col p-9 gap-5 bg-white">
        <h2 class="text-[1.5rem] text-[#3a3a3a] font-semibold">Recent Posts</h2>
       <div class="flex flex-col gap-1">
            {% for cat in categories  %}
            <a href="{% url 'blog:pid' pid=post.id %}" class="md:text-lg text-md text-[#444444] font-medum hover:text-black transition">{{cat.name}}</a>
            {% endfor %}
        </div>
    </div>
</div>
