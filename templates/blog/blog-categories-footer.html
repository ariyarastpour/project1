{% load static %}

<div class="flex flex-col gap-5 w-full sm:w-1/2 lg:w-1/5">
    <h2 class="text-white font-semibold md:text-2xl text-xl md:pb-3 pb-2">Categories</h2>
    <div class="md:flex md:flex-col grid grid-cols-2 gap-x-6 gap-y-1">
        {% for name in categories %}
            <a href="{% url 'blog:category' cat_name=name %}" class="text-white md:text-lg text-md hover:text-black transition">{{name}}</a>
        {% endfor %}
    </div>
</div>
